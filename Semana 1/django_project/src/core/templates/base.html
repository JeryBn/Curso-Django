<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Laboratorio 1 Django{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Segoe UI", Arial, sans-serif; background: #f4f6f8; color: #1f2933; line-height: 1.6; }
        header { background: #1f3a5f; color: #fff; padding: 1.2rem 2rem; }
        header h1 { font-size: 1.3rem; font-weight: 600; }
        nav { background: #fff; border-bottom: 1px solid #d9e2ec; padding: 0.6rem 2rem; }
        nav a { color: #1f3a5f; font-weight: 600; text-decoration: none; margin-right: 1.2rem; }
        nav a:hover { text-decoration: underline; }
        main { max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
        footer { text-align: center; color: #829ab1; font-size: 0.85rem; padding: 2rem 0; }
    </style>
</head>
<body>
    <header>
        <h1>Laboratorio 1: Aplicacion Web con Django</h1>
    </header>
    <nav>
        <a href="{% url 'core:item_list' %}">Items</a>
        <a href="/admin/">Admin</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>Guia 1 - Laboratorio 1</p>
    </footer>
</body>
</html>
