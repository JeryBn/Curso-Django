{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Catálogo de libros, autores y editoriales. Laboratorio de relaciones de modelos en Django.">
    <title>{% block title %}Biblioteca · Catálogo{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'library/css/styles.css' %}">
</head>
<body>
    <a class="skip-link" href="#main-content">Saltar al contenido</a>
    <header class="site-header">
        <div class="container header-content">
            <a class="brand" href="{% url 'library:book_list' %}" aria-label="Biblioteca, inicio">
                <span class="brand-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                        <path d="M12 5v15M3 4c3-1 6-1 9 1 3-2 6-2 9-1v15c-3-1-6-1-9 1-3-2-6-2-9-1V4Z"/>
                    </svg>
                </span>
                Biblioteca<span class="brand-dot">.</span>
            </a>
            <nav class="main-nav" aria-label="Navegación principal">
                <a href="{% url 'library:book_list' %}"{% if request.resolver_match.url_name == 'book_list' %} aria-current="page"{% endif %}>Catálogo</a>
                <a class="admin-link" href="{% url 'admin:index' %}">Administrar <span aria-hidden="true">↗</span></a>
            </nav>
        </div>
    </header>

    <main id="main-content" class="container main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <span>Una biblioteca, muchas conexiones.</span>
            <span>Laboratorio 04 <span class="footer-separator">/</span> Django · Modelos relacionados</span>
        </div>
    </footer>
</body>
</html>
