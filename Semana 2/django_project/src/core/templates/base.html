<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Laboratorio Django{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Segoe UI", Arial, sans-serif; background: #f4f6f8; color: #1f2933; line-height: 1.6; }
        header { background: #1f3a5f; color: #fff; padding: 1.2rem 2rem; }
        header h1 { font-size: 1.3rem; font-weight: 600; }
        nav { background: #fff; border-bottom: 1px solid #d9e2ec; padding: 0.6rem 2rem; }
        nav a { color: #1f3a5f; font-weight: 600; text-decoration: none; margin-right: 1.2rem; }
        nav a:hover { text-decoration: underline; }
        main { max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
        th { background: #1f3a5f; color: #fff; text-align: left; padding: 0.7rem; font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 0.7rem; border-bottom: 1px solid #d9e2ec; }
        .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .badge-high { background: #fde2e2; color: #9b1c1c; }
        .badge-medium { background: #fef3c7; color: #92400e; }
        .badge-low { background: #d1fae5; color: #065f46; }
        .btn { display: inline-block; background: #1f3a5f; color: #fff; padding: 0.5rem 1.1rem; border-radius: 6px; text-decoration: none; font-weight: 600; }
        .btn:hover { background: #2c5282; }
        button[type="submit"] { background: #1f3a5f; color: #fff; border: none; padding: 0.6rem 1.4rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
        input, textarea, select { width: 100%; padding: 0.55rem; margin: 0.25rem 0 0.8rem; border: 1px solid #bcccdc; border-radius: 6px; }
        form { background: #fff; border: 1px solid #d9e2ec; border-radius: 8px; padding: 1.5rem; }
        .messages { list-style: none; background: #d1fae5; border: 1px solid #6ee7b7; border-radius: 6px; padding: 0.7rem 1rem; margin-bottom: 1rem; }
        footer { text-align: center; color: #829ab1; font-size: 0.85rem; padding: 2rem 0; }
    </style>
</head>
<body>
    <header>
        <h1>Laboratorio 2: Flujo de trabajo en Django</h1>
    </header>
    <nav>
        <a href="{% url 'core:item_list' %}">Items</a>
        <a href="{% url 'tasks:task_list' %}">Tareas</a>
        <a href="/admin/">Admin</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>Guia 2 - Laboratorio 2 (acumulativo del Lab 1)</p>
    </footer>
</body>
</html>
